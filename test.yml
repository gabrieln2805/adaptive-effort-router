name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run routing + pricing tests
        run: npm test
        # Note: npm run test:tokenizer is intentionally NOT run in CI —
        # it calls the real Anthropic API and requires a funded
        # ANTHROPIC_API_KEY secret. Run it manually/locally when you need
        # to re-check the tokenizer multiplier against real content.
